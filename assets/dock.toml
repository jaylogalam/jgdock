# jgdock configuration.
#
# jgdock is a window-based dock manager. Each `[slots.<name>]` block defines
# a generic dock position (geometry + a stash workspace). Any focused window
# can be docked into any slot via:
#
#   jgdock dock   <slot>     # pin the focused window into slot geometry
#   jgdock undock            # unpin the focused window
#   jgdock toggle <slot>     # show slot's window if hidden, hide if shown
#   jgdock ls                # list configured slots
#
# Geometry axes accept either raw pixel integers (e.g. `y = 27`) or Hyprland
# monitor-arithmetic expressions as strings (e.g. `width = "monitor_w/3-1"`).
# Anything that Hyprland's `dispatcher` evaluates is allowed.
#
# Each slot's `stash` is the special workspace used both as the window's
# "hidden" home and as the slot's registry: the window currently sitting on
# `<stash>` IS the slot's bound window. Defaults to `special:<slot_name>` when
# omitted. Set `stash = ""` to disable the registry (toggle won't find the
# prior occupant, but dock/undock still work).

[slots.right]
x       = "monitor_w*2/3"
y       = 27
width   = "monitor_w/3-1"
height  = "monitor_h-28"

[slots.left]
x       = 0
y       = 27
width   = "monitor_w/3-1"
height  = "monitor_h-28"

[slots.center]
x       = "monitor_w/3"
y       = 27
width   = "monitor_w/3-1"
height  = "monitor_h-28"

[slots.full]
x       = 0
y       = 27
width   = "monitor_w-2"
height  = "monitor_h-28"